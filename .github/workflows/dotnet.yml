name: dotnet

on:
  push:
    branches: [main]
    paths: ['dotnet/**', 'fixtures.json', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', 'fixtures.json', '.github/workflows/dotnet.yml']

permissions:
  contents: read

jobs:
  dotnet:
    name: Spart.Sdk (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Spart.Sdk.sln
      - name: Build
        run: dotnet build Spart.Sdk.sln --no-restore -c Release
      - name: Test
        run: dotnet test Spart.Sdk.sln --no-build -c Release
