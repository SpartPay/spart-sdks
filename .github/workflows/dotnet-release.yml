name: dotnet-release

# Publishes the Spart.Sdk NuGet package using OIDC trusted publishing.
# Trigger: publish a GitHub Release whose tag is `dotnet-vX.Y.Z`
# (e.g. dotnet-v0.1.0). The tag is the single source of truth for the
# published version; the committed <Version> is a placeholder.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    # Run for dotnet-prefixed release tags, or any manual dry-run dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'dotnet-v')
    name: Publish Spart.Sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release  # scopes the NUGET_USER secret + optional approval gate
    permissions:
      contents: read
      id-token: write  # required for NuGet OIDC trusted publishing
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        id: version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#dotnet-v}"
          if [ -z "$version" ] || [ "$version" = "$tag" ]; then
            echo "::error::Tag '$tag' is not in the expected 'dotnet-vX.Y.Z' format."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # On a manual dispatch there is no tag, so use the placeholder to dry-run pack.
      - name: Resolve pack version
        id: pack
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test Spart.Sdk.sln -c Release --nologo

      - name: Pack
        run: dotnet pack src/Spart.Sdk/Spart.Sdk.csproj -c Release -o ./artifacts -p:Version=${{ steps.pack.outputs.version }} --nologo

      - name: NuGet login (OIDC)
        id: login
        if: github.event_name == 'release'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, NOT email

      - name: Push to NuGet
        if: github.event_name == 'release'
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
