name: node-release

# Publishes @spartpay/sdk to npm using OIDC trusted publishing.
# Trigger: publish a GitHub Release whose tag is `node-vX.Y.Z`
# (e.g. node-v0.1.1). The tag is the single source of truth for the
# published version; the committed package.json version is a placeholder.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    # Run for node-prefixed release tags, or any manual diagnostic dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'node-v')
    name: Publish @spartpay/sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # required for npm OIDC trusted publishing
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: node/package-lock.json

      # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into the npm userconfig. With no NODE_AUTH_TOKEN this placeholder resolves to an
      # empty token, but its mere presence makes npm treat a credential as configured and
      # skip OIDC — causing `npm publish` to fail with E404. Removing the line lets npm's
      # OIDC trusted-publishing flow run (the id-token is available via id-token: write).
      - name: Enable npm OIDC trusted publishing
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken=/d' "$NPM_CONFIG_USERCONFIG"
          fi

      # Trusted publishing requires npm >= 11.5.1, which ships with Node 24.
      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Derive version from tag
        id: version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#node-v}"
          if [ -z "$version" ] || [ "$version" = "$tag" ]; then
            echo "::error::Tag '$tag' is not in the expected 'node-vX.Y.Z' format."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set package version from tag
        if: github.event_name == 'release'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # No NODE_AUTH_TOKEN: authentication is via OIDC trusted publishing.
      # npm automatically attaches build provenance when publishing this way.
      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --access public
