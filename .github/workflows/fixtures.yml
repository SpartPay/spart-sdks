name: fixtures

on:
  push:
    branches: [main]
    paths: ['fixtures.json', 'tools/generate-fixtures.mjs', '.github/workflows/fixtures.yml']
  pull_request:
    paths: ['fixtures.json', 'tools/generate-fixtures.mjs', '.github/workflows/fixtures.yml']

permissions:
  contents: read

jobs:
  drift:
    name: fixtures.json matches generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
      - name: Regenerate fixtures
        run: node tools/generate-fixtures.mjs
      - name: Verify committed fixtures.json is up to date
        run: git diff --exit-code fixtures.json
