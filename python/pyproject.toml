[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spart-sdk"
version = "0.1.0"
description = "Spart webhook signature verification for Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/spart_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
